name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry + build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          key: windows-latest

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build and upload Windows installer
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Codex Session Manager ${{ github.ref_name }}"
          releaseBody: "See [CHANGELOG.md](./CHANGELOG.md) for details. Installers attached below."
          releaseDraft: true
          prerelease: false
          args: "--bundles nsis"

      - name: Upload Windows portable zip
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.ref_name }}"
          $asset = "Codex.Session.Manager_${tag}_x64-portable.zip"
          Compress-Archive `
            -Path "src-tauri/target/release/codex-session-manager.exe" `
            -DestinationPath $asset `
            -Force
          gh release upload $tag $asset --clobber

  publish-release:
    needs: build
    runs-on: ubuntu-22.04
    steps:
      - name: Mark draft release ready
        uses: actions/github-script@v7
        env:
          TAG_NAME: ${{ github.ref_name }}
        with:
          script: |
            const tag = process.env.TAG_NAME;
            const { data: releases } = await github.rest.repos.listReleases({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            // 같은 tag의 draft 우선, 없으면 이미 published된 것도 받아들임 (idempotent)
            const draft = releases.find(r => r.tag_name === tag && r.draft);
            const published = releases.find(r => r.tag_name === tag && !r.draft);
            if (draft) {
              await github.rest.repos.updateRelease({
                owner: context.repo.owner,
                repo: context.repo.repo,
                release_id: draft.id,
                draft: false,
              });
              core.info(`Published release ${draft.id} for tag ${tag}`);
            } else if (published) {
              core.info(`Release for tag ${tag} is already published (id=${published.id}). Nothing to do.`);
            } else {
              throw new Error(`No release (draft or published) found for tag ${tag}`);
            }
